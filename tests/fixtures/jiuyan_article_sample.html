        </div></div></div> <div class="<script>window.__NUXT__=(function(a){return {data:[{data:{article_id:a,content:"\u003Chtml\u003E\n\u003Chead\u003E\n\n\u003C\u002Fhead\u003E\n\u003Cbody\u003E\n\u003Cp dir=\"ltr\"\u003E直接说答案：\u003Cb\u003E\u003Cb\u003E\u003Cb\u003E\u003Cb\u003E\u003Cb\u003E\u003Cb\u003E\u003Cb\u003E\u003Cb\u003E\u003Cb\u003E\u003Cb\u003E\u003Cb\u003E数据采集\u003C\u002Fb\u003E\u003C\u002Fb\u003E\u003C\u002Fb\u003E\u003C\u002Fb\u003E\u003C\u002Fb\u003E\u003C\u002Fb\u003E\u003C\u002Fb\u003E\u003C\u002Fb\u003E\u003C\u002Fb\u003E\u003C\u002Fb\u003E\u003C\u002Fb\u003E\u003C\u002Fp\u003E\n\u003Cp dir=\"ltr\"\u003E机器人不缺身体，缺的是教材\u003C\u002Fp\u003E\n\u003Cp dir=\"ltr\"\u003E机器人这波行情，很多人还在算减速器的账，但真正卡住产业的早就不是硬件了。一台人形机器人能跑能跳，却拧不开一瓶没见过的矿泉水——不是它不够聪明，是它“没见过世面”。文本数据互联网上遍地都是，物理世界的交互数据却只能一帧一帧采：视觉、关节角度、力矩、触觉必须毫秒级对齐，采一小时真机数据报价500到1000元，而原始数据加工折损率高达70%，最后能进训练集的不到三成。这也是为什么全国一年冒出70多座训练场、头部公司砸几个亿建数据工厂——本体是红海，数据是无人区。这篇把数据采集这条链，从设备、采集、治理到标的，一次拆清楚。\u003C\u002Fp\u003E\n\u003Cp dir=\"ltr\"\u003E\u003Cimg src=\"https:\u002F\u002Fcdn.jiuyangongshe.com\u002Fimages\u002F1792742183469_58.png?x-oss-process=image\u002Fauto-orient,1\u002Fwatermark,type_ZmFuZ3poZW5naGVpdGk,size_36,text_6Z-t56CU5YWs56S-77yaQOi1t-eIhuWJjeWkleaMluaOmA,color_FFFFFF,shadow_50,t_100,g_se,x_16,y_16\"\u003E\u003Cbr\u003E\n\u003Ca target=\"_blank\" href=\"https:\u002F\u002Fwww.jiuyangongshe.com\u002Fstock\u002Fs\u002F11658be7c55b456da38bef840a44e7b6\" target=\"_blank\" style=\"color:#337df2\"\u003ES福莱新材(sh605488)S\u003C\u002Fa\u003E\u003Ca target=\"_blank\" href=\"https:\u002F\u002Fwww.jiuyangongshe.com\u002Fstock\u002Fs\u002F67ee226dc3a94f20886fce87740dd4bb\" target=\"_blank\" style=\"color:#337df2\"\u003ES利亚德(sz300296)S\u003C\u002Fa\u003E\u003Ca target=\"_blank\" href=\"https:\u002F\u002Fwww.jiuyangongshe.com\u002Fstock\u002Fs\u002Fc57264b555ec47d9b35b7fbd4c8520c8\" target=\"_blank\" style=\"color:#337df2\"\u003ES奥比中光(sh688322)S\u003C\u002Fa\u003E\u003Ca target=\"_blank\" href=\"https:\u002F\u002Fwww.jiuyangong
